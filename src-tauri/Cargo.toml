[package]
name = "stegstr-cli"
version = "0.2.0"
edition = "2021"
description = "Stegstr Robust Edition — JPEG-surviving steganographic CLI"
license = "MIT"
authors = ["Stegstr Robust Edition contest entry #93"]

[[bin]]
name = "stegstr-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
hex = "=0.4.3"
crc32fast = "=1.4.2"
colorchoice = "=1.0.0"
anstream = "=0.6.15"
anstyle = "=1.0.8"
anstyle-parse = "=0.2.6"
anstyle-query = "=1.1.1"
clap_builder = "=4.4.18"
clap_derive = "=4.4.7"
clap_lex = "=0.6.0"
